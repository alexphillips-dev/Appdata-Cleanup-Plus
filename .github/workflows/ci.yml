name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Check JavaScript syntax
        run: |
          node --check source/appdata.cleanup.plus/usr/local/emhttp/plugins/appdata.cleanup.plus/scripts/appdata.cleanup.plus.shared.js
          node --check source/appdata.cleanup.plus/usr/local/emhttp/plugins/appdata.cleanup.plus/scripts/appdata.cleanup.plus.panels.js
          node --check source/appdata.cleanup.plus/usr/local/emhttp/plugins/appdata.cleanup.plus/scripts/appdata.cleanup.plus.js
          node --check tests/diagnostics_privacy_client.js
          node --check tests/shared_client_security.js

      - name: Run client security tests
        run: |
          node tests/diagnostics_privacy_client.js
          node tests/shared_client_security.js

      - name: Check bundled language coverage and runtime localization
        run: |
          node scripts/build_i18n.mjs --check
          php tests/i18n_smoke.php
          node tests/i18n_client.js
          node tests/i18n_page.js
          node tests/i18n_flows.js

      - name: Check PHP syntax
        run: |
          while IFS= read -r file; do
            php -l "$file"
          done < <(git ls-files '*.php' '*.page')

      - name: Check native Unraid themes in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/acp-browser" --no-save --ignore-scripts playwright@1.63.0 jquery@3.7.1
          "$RUNNER_TEMP/acp-browser/node_modules/.bin/playwright" install --with-deps chromium
          ACP_BROWSER_MODULES="$RUNNER_TEMP/acp-browser/node_modules" node tests/browser_fixture_test.cjs
          ACP_BROWSER_MODULES="$RUNNER_TEMP/acp-browser/node_modules" node tests/theme_ui.cjs
          ACP_BROWSER_MODULES="$RUNNER_TEMP/acp-browser/node_modules" node tests/maintenance_ui.cjs

      - name: Check destructive confirmation flows
        run: bash scripts/test_ui_confirmation.sh

      - name: Check plugin function resolution and ownership safety
        run: |
          php tests/php_function_checker.php
          php scripts/check_php_functions.php
          php tests/ownership_templates.php

      - name: Check diagnostics privacy guards
        run: bash scripts/test_diagnostics_privacy.sh

      - name: Check shell syntax
        run: bash -n scripts/*.sh pkg_build.sh

      - name: Run ShellCheck
        run: shellcheck --severity=warning scripts/*.sh pkg_build.sh source/appdata.cleanup.plus/pkg_build.sh

      - name: Run release guards
        run: |
          bash scripts/test_manifest_xml_guard.sh
          bash scripts/release_guard.sh
          bash scripts/ca_readiness_guard.sh
          bash scripts/test_ca_canonical_urls.sh
          bash scripts/test_release_source_ref.sh
          bash scripts/test_package_source_parity.sh
          bash scripts/test_package_line_endings.sh

      - name: Prepare Unraid path fixtures
        run: |
          sudo mkdir -p /mnt/user /mnt/fcache /mnt/docker_vm_nvme
          sudo chmod 0777 /mnt/user /mnt/fcache /mnt/docker_vm_nvme

      - name: Run behavior smoke test
        run: bash scripts/test_behavior.sh
