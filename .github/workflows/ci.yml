name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Check JavaScript syntax
        run: |
          node --check source/appdata.cleanup.plus/usr/local/emhttp/plugins/appdata.cleanup.plus/scripts/appdata.cleanup.plus.shared.js
          node --check source/appdata.cleanup.plus/usr/local/emhttp/plugins/appdata.cleanup.plus/scripts/appdata.cleanup.plus.panels.js
          node --check source/appdata.cleanup.plus/usr/local/emhttp/plugins/appdata.cleanup.plus/scripts/appdata.cleanup.plus.js
          node --check tests/diagnostics_privacy_client.js
          node --check tests/shared_client_security.js

      - name: Run client security tests
        run: |
          node tests/diagnostics_privacy_client.js
          node tests/shared_client_security.js

      - name: Check PHP syntax
        run: |
          while IFS= read -r file; do
            php -l "$file"
          done < <(git ls-files '*.php' '*.page')

      - name: Check destructive confirmation flows
        run: bash scripts/test_ui_confirmation.sh

      - name: Check diagnostics privacy guards
        run: bash scripts/test_diagnostics_privacy.sh

      - name: Check shell syntax
        run: bash -n scripts/*.sh pkg_build.sh

      - name: Run ShellCheck
        run: shellcheck --severity=warning scripts/*.sh pkg_build.sh source/appdata.cleanup.plus/pkg_build.sh

      - name: Run release guards
        run: |
          bash scripts/test_manifest_xml_guard.sh
          bash scripts/release_guard.sh
          bash scripts/ca_readiness_guard.sh
          bash scripts/test_release_source_ref.sh
          bash scripts/test_package_source_parity.sh

      - name: Prepare Unraid path fixtures
        run: |
          sudo mkdir -p /mnt/user /mnt/fcache /mnt/docker_vm_nvme
          sudo chmod 0777 /mnt/user /mnt/fcache /mnt/docker_vm_nvme

      - name: Run behavior smoke test
        run: bash scripts/test_behavior.sh
